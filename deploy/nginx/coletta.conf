# /etc/nginx/sites-available/coletta  (etapa 2: HTTPS, depois de emitir o certificado)
# Em servidor novo, comece pelo coletta-http.conf: o Certbot precisa da porta 80 respondendo
# antes de existir certificado.

# HTTP: só responde à validação do Let's Encrypt; todo o resto vai para HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 137.131.137.14;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 137.131.137.14;
    server_tokens off;
    client_max_body_size 1m;

    # Certificado Let's Encrypt para o IP (perfil shortlived, 6 dias, renovado pelo Certbot)
    ssl_certificate     /etc/letsencrypt/live/137.131.137.14/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/137.131.137.14/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # PQC: troca de chaves híbrida ML-KEM primeiro (OpenSSL 3.5+), clássicas como fallback
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    # Cifras do TLS 1.2 (o TLS 1.3 usa as próprias, todas fortes): só ECDHE com AEAD
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /static/ {
        alias /srv/coletta/app/staticfiles/;
        # O navegador revalida a cada acesso (304 se não mudou): CSS novo aparece logo após o deploy
        add_header Cache-Control "no-cache" always;
        # add_header dentro de location descarta os do server; por isso o HSTS é repetido aqui
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://unix:/run/coletta.sock;
        proxy_set_header Host $host;
        # Sobrescreve qualquer valor enviado pelo cliente: é o IP usado pelo django-axes
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
