# /etc/nginx/sites-available/coletta  (etapa 1: só HTTP, antes do certificado)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 137.131.137.14;

    server_tokens off;
    client_max_body_size 1m;

    # Validação do Let's Encrypt (Certbot em modo webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /srv/coletta/app/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/coletta.sock;
        proxy_set_header Host $host;
        # Sobrescreve qualquer valor enviado pelo cliente: é o IP usado pelo django-axes
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
