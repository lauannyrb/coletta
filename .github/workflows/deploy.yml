name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# O token do GitHub só lê o repositório
permissions:
  contents: read

# Um deploy por vez, na ordem dos pushes
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  checks:
    name: Testes e verificações
    runs-on: ubuntu-latest
    env:
      DEBUG: 'False'
      ALLOWED_HOSTS: 137.131.137.14
      BEHIND_PROXY: 'True'
    steps:
      # Actions fixadas por SHA (e não só pela tag) para evitar troca maliciosa de versão
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Instalar Python 3.14 e dependências
        run: |
          uv venv
          uv pip sync requirements.txt

      - name: Gerar SECRET_KEY descartável
        run: |
          key=$(.venv/bin/python -c "from django.core.management.utils import get_random_secret_key as g; print(g())")
          echo "::add-mask::$key"
          echo "SECRET_KEY=$key" >> "$GITHUB_ENV"

      - name: Django check --deploy
        run: .venv/bin/python manage.py check --deploy --fail-level ERROR

      - name: Testes
        run: .venv/bin/python manage.py test

      - name: Auditoria de dependências (pip-audit)
        run: uvx pip-audit@2.10.1 --requirement requirements.txt --strict

  deploy:
    name: Deploy no servidor
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Chave do servidor fixa (vinda do Secret): nunca desligar StrictHostKeyChecking
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Publicar o commit testado
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "$GITHUB_SHA"

      - name: Verificar se o site respondeu
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 5 --retry-delay 3 --retry-all-errors \
            "https://$SSH_HOST/entrar/"

      - name: Apagar a chave do runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
