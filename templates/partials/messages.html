{% if messages %}
<div class="messages" role="status">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }}">
    {% if message.level_tag == 'error' %}
      {% include "partials/icon.html" with name="alert" %}
    {% else %}
      {% include "partials/icon.html" with name="check" %}
    {% endif %}
    <p>{{ message }}</p>
  </div>
  {% endfor %}
</div>
{% endif %}
